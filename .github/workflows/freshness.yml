name: freshness
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  claims-online:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Re-check every source URL and expected text
        shell: bash
        run: python3 scripts/check_claims.py --online | tee claims.txt
      - name: Reviews overdue
        if: always()
        shell: bash
        run: python3 scripts/check_staleness.py | tee stale.txt
      - name: Surface warnings and notes
        if: always()
        shell: bash
        run: |
          {
            echo "### Freshness"
            grep -hE '^(WARN|NOTE|STALE)' claims.txt stale.txt 2>/dev/null || echo "no warnings"
          } >> "$GITHUB_STEP_SUMMARY"
          grep -hE '^WARN' claims.txt 2>/dev/null | while read -r _ line; do echo "::warning::$line"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freshness-output
          path: |
            claims.txt
            stale.txt
          if-no-files-found: ignore

  jdk-defaults-latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ["21", "25", "27"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: Documented defaults match the latest build
        run: python3 scripts/check_jdk_defaults.py

  report:
    needs: [claims-online, jdk-defaults-latest]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: freshness-output
      - name: Open or update a tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create freshness --color D93F0B --description "Monthly freshness check failed" --force || true
          body="$(printf 'Monthly freshness check failed: %s/%s/actions/runs/%s\n\nclaims-online: %s\njdk-defaults-latest: %s\n\n```\n%s\n%s\n```\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "${{ needs.claims-online.result }}" "${{ needs.jdk-defaults-latest.result }}" "$(cat claims.txt 2>/dev/null)" "$(cat stale.txt 2>/dev/null)")"
          number="$(gh issue list --label freshness --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Freshness check failed" --label freshness --body "$body"
          fi
