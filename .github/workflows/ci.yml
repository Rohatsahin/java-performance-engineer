name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Claims (offline)
        run: python3 scripts/check_claims.py
      - name: Links and source IDs
        run: python3 scripts/check_links.py
      - name: Script syntax
        run: sh -n scripts/collect-request-pack.sh
